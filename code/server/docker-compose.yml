services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "2222:2222"

  api:
    build: .
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: TasksManager
      PORT: 5001
      FCM_CREDENTIALS_PATH: /run/secrets/fcm_service_account.json
    depends_on:
      - db
    ports:
      - "${API_PORT:-5001}:5001"
    volumes:
      - ./tasky-694f6-firebase-adminsdk-fbsvc-9c26bccc48.json:/run/secrets/fcm_service_account.json:ro

  docs:
    build:
      context: .
      target: docs
    command: python -m http.server 8080 -d /app/docs/_build/html
    ports:
      - "${DOCS_PORT:-8080}:8080"
    # Rebuild docs only when source changes; for live dev use sphinx-autobuild locally
    depends_on:
      - api

volumes:
  db_data:
